spring.application.name=livraria
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database (SQL Server) - valores vindos de variáveis de ambiente
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:api};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERT:true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
